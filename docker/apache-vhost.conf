# Apache virtual host for the lastfm random-artists app.
# Only /opt/lastfm/public is served; application code and the cache live
# outside the web root and are additionally denied below (defence in depth).

<VirtualHost *:80>
    DocumentRoot /opt/lastfm/public
    AddDefaultCharset UTF-8

    <Directory /opt/lastfm/public>
        Options -Indexes -Includes -ExecCGI
        AllowOverride None
        Require all granted

        # Endpoints return HTML fragments only; the page itself is static.
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "no-referrer"
    </Directory>

    # Belt-and-braces: never serve source, tests or the writable cache even if
    # the document root is ever changed by mistake.
    <DirectoryMatch "/opt/lastfm/(src|tests|cache)">
        Require all denied
    </DirectoryMatch>

    # Hide dotfiles (.gitignore, .env, ...).
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Allow only the pinned CDNs the UI uses; no inline event handlers.
    # Icons are self-hosted SVGs, so no font-src is needed.
    <Files "music_list.html">
        Header always set Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline' https://ajax.googleapis.com https://maxcdn.bootstrapcdn.com https://code.jquery.com https://cdnjs.cloudflare.com; style-src 'unsafe-inline' https://maxcdn.bootstrapcdn.com https://code.jquery.com; img-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'"
    </Files>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
